<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484.8 200" role="img" aria-label="TURUI">
  <title>TURUI</title>
  <style>
    .lk-l, .lk-r {
      animation: lk-openL 2.4s cubic-bezier(.22,.61,.36,1) forwards;
    }
    .lk-r { animation-name: lk-openR; }
    .lk-cut {
      fill: none;
      stroke: #121212;
      stroke-width: 2.2;
      stroke-linecap: square;
      stroke-dasharray: 124.62;
      stroke-dashoffset: 124.62;
      animation: lk-draw 1.0s cubic-bezier(.22,.61,.36,1) forwards,
                 lk-fade 0.55s ease 0.95s forwards;
    }
    @keyframes lk-openL {
      0%, 30% { transform: translate(3.004px, -0.841px); }
      82% { transform: translate(-0.481px, 0.135px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes lk-openR {
      0%, 30% { transform: translate(-3.004px, 0.841px); }
      82% { transform: translate(0.481px, -0.135px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes lk-draw { to { stroke-dashoffset: 0; } }
    @keyframes lk-fade { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .lk-l, .lk-r, .lk-cut, .lk-letter {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .lk-cut { opacity: 0 !important; }
    }
    .lk-letter {
      opacity: 0;
      transform: translate(8px, 0);
      animation: lk-in 0.85s cubic-bezier(.22,.61,.36,1) forwards;
    }
    @keyframes lk-in {
      to { opacity: 1; transform: translate(0, 0); }
    }
  </style>

