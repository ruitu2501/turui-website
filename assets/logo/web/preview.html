<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TURUI · 网页动效</title>
  <style>
    :root { --ink:#141414; --paper:#f4f3ef; --muted:#6e6c66; --line:#dddcd6; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", "Source Han Serif SC", serif;
    }
    nav {
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      border-bottom: 1px solid var(--line);
      gap: 16px;
    }
    nav .mark { width: 36px; height: 36px; }
    nav .word { width: 140px; height: 36px; display: flex; align-items: center; }
    nav .word svg { width: 140px; height: auto; }
    .links { margin-left: auto; display: flex; gap: 28px; font-size: 13px; letter-spacing: .18em; color: var(--muted); }
    .hero {
      min-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px 80px;
      text-align: center;
    }
    .kicker {
      font-size: 12px;
      letter-spacing: .42em;
      color: var(--muted);
      margin: 0 0 36px;
      font-weight: 300;
    }
    .lockup { width: min(520px, 86vw); }
    .lockup svg { width: 100%; height: auto; display: block; }
    button {
      margin-top: 48px;
      background: none;
      border: 1px solid #c8c6c0;
      color: var(--ink);
      padding: 8px 18px;
      font-size: 12px;
      letter-spacing: .18em;
      cursor: pointer;
    }
    button:hover { border-color: var(--ink); }
    section.dark {
      background: #121212;
      color: #f4f3ef;
      padding: 96px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    section.dark .lockup { width: min(420px, 80vw); }
    section.dark button { color: #f4f3ef; border-color: #3a3a3a; }
    section.dark button:hover { border-color: #f4f3ef; }
    .note {
      max-width: 680px;
      margin: 0 auto;
      padding: 64px 24px 96px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      font-family: "Noto Sans SC", "Source Han Sans SC", sans-serif;
    }
    .note h2 {
      font-weight: 500;
      font-size: 15px;
      letter-spacing: .12em;
      color: var(--ink);
    }
    .note code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #eceae4;
      padding: 1px 5px;
    }
  </style>
</head>
<body>
  <nav>
    <div class="mark" id="nav-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="TURUI">
  <title>TURUI</title>
  <style>
    .m-l, .m-r {
      animation: m-openL 2.4s cubic-bezier(.22,.61,.36,1) forwards;
    }
    .m-r { animation-name: m-openR; }
    .m-cut {
      fill: none;
      stroke: #f4f3ef;
      stroke-width: 2.2;
      stroke-linecap: square;
      stroke-dasharray: 124.62;
      stroke-dashoffset: 124.62;
      animation: m-draw 1.0s cubic-bezier(.22,.61,.36,1) forwards,
                 m-fade 0.55s ease 0.95s forwards;
    }
    @keyframes m-openL {
      0%, 30% { transform: translate(3.004px, -0.841px); }
      82% { transform: translate(-0.481px, 0.135px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes m-openR {
      0%, 30% { transform: translate(-3.004px, 0.841px); }
      82% { transform: translate(0.481px, -0.135px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes m-draw { to { stroke-dashoffset: 0; } }
    @keyframes m-fade { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .m-l, .m-r, .m-cut, .m-letter {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .m-cut { opacity: 0 !important; }
    }
  </style>

  <g class="m-l"><polygon points="40.000,40.000 79.960,40.000 113.560,160.000 40.000,160.000" fill="#141414"/></g>
  <g class="m-r"><polygon points="86.440,40.000 160.000,40.000 160.000,160.000 120.040,160.000" fill="#141414"/></g>
  <line class="m-cut" x1="83.200" y1="40.000" x2="116.800" y2="160.000"/>
</svg>
</div>

</div>

  <div class="note">
    <h2>网页用法</h2>
    <p>请把 <code>svg/lockup-animated.svg</code>（浅底）或 <code>svg/lockup-animated-on-dark.svg</code>（深底）的内容直接内联进网页，不要用 <code>&lt;img&gt;</code> 引用——内联后 CSS 动效才能播放，也可以按需重播。导航栏小标志用 <code>svg/mark-animated.svg</code>。</p>
    <p>如果必须用图片标签，请改用配套的 GIF（<code>png/anim-lockup-light.gif</code> / <code>anim-lockup-dark.gif</code>）。系统开启「减少动态效果」时，SVG 会直接显示最终静止状态。</p>
  </div>
  <script>
    function replay(id) {
      const stage = document.getElementById(id);
      const html = stage.innerHTML;
      stage.innerHTML = "";
      stage.innerHTML = html;
    }
    document.getElementById("replay-light").addEventListener("click", () => {
      replay("hero-light"); replay("nav-mark");
    });
    document.getElementById("replay-dark").addEventListener("click", () => replay("hero-dark"));
  </script>
